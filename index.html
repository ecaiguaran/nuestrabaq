<meta name="description" content="Test de arquetipos de liderazgo de NuestraBarranquilla para BAQMUN 2026.">

<style>
/* Layout: una columna tipo app móvil; intro → datos → 3 partes del test → resultado. El color de cada arquetipo es el protagonista. */
/* Look & feel: Brand Guidelines NuestraBarranquilla v1.0. Colores preferentes (Gris, Azul Turquí, Amarillo, Verde, Azul, Magenta, Rosado).
   Tipografía complementaria Gotham Rounded → sustituto web Nunito (redondeada). Fondo gris de marca; modo oscuro en Azul Turquí. */
:root{
  --bg:#E7DFE0; --surface:#FFFFFF; --ink:#2C394E; --muted:#56627A; --line:#D6CCCD; --focus:#45A3DB; --warn:#C40A2B; --warn-soft:#FBD9DF;
  --a:#16A47D; --b:#45A3DB; --c:#FBBC3A; --d:#E40C32; --rosa:#EB5889;
  --a-on:#2C394E; --b-on:#2C394E; --c-on:#2C394E; --d-on:#FFFFFF;
  --a-tx:#0E7A5C; --b-tx:#1F6FA3; --c-tx:#8A5A00; --d-tx:#C40A2B;
  --a-soft:#D3EFE6; --b-soft:#D8ECF8; --c-soft:#FEEFCF; --d-soft:#FBD9DF;
  --on-accent:#2C394E; --sticker:#E7DFE0;
  --display:"Nunito","Gotham Rounded","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito","Gotham Rounded",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#2C394E; --surface:#36455D; --ink:#F5F0F1; --muted:#C2C9D6; --line:#4A5870; --focus:#7CC2EE; --warn:#FF8A9C; --warn-soft:#5C2C3C;
  --a-tx:#3FD0A4; --b-tx:#7CC2EE; --c-tx:#FBBC3A; --d-tx:#FF6B84;
  --a-soft:#20514A; --b-soft:#2F5572; --c-soft:#5A4A2A; --d-soft:#5C2C3C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2C394E; --surface:#36455D; --ink:#F5F0F1; --muted:#C2C9D6; --line:#4A5870; --focus:#7CC2EE; --warn:#FF8A9C; --warn-soft:#5C2C3C;
  --a-tx:#3FD0A4; --b-tx:#7CC2EE; --c-tx:#FBBC3A; --d-tx:#FF6B84;
  --a-soft:#20514A; --b-soft:#2F5572; --c-soft:#5A4A2A; --d-soft:#5C2C3C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:900;text-wrap:balance;margin:0;line-height:1.1}
p{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
a{color:var(--ink)}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.hero{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.hero h1{font-size:clamp(34px,9vw,52px);font-weight:800;letter-spacing:-.02em}
.quad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quad div{aspect-ratio:1;border-radius:14px;display:grid;place-items:center;color:var(--on-accent);max-width:100%}
.quad svg{width:46%;height:46%}
.lead{color:var(--muted);font-size:17px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:14px}
.panel h3{font-size:20px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.list li{display:flex;gap:10px;align-items:flex-start}
.dot{width:8px;height:8px;border-radius:50%;margin-top:8px;flex:none}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.steps div{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:2px;min-width:0}
.steps b{font-family:var(--display);font-size:22px}
.steps span{font-size:13px;color:var(--muted);line-height:1.3}
label{font-weight:600;font-size:14px}
.field{display:grid;gap:6px}
input[type=text],input[type=email],select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.checks{display:grid;gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:500;font-size:15px}
.check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--ink)}
.legal{font-size:13px;color:var(--muted);line-height:1.5;display:grid;gap:8px;max-height:0;overflow:hidden;transition:max-height .3s}
.legal.open{max-height:900px}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;font-weight:600;text-align:left}
.err{color:var(--warn);font-size:14px;font-weight:600;min-height:1.2em}
[hidden]{display:none!important}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.banner{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:14px}
.btn{border:0;border-radius:999px;padding:15px 22px;font-weight:700;font-size:17px;background:var(--ink);color:var(--bg);transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.topbar{display:flex;align-items:center;gap:12px}
.back{background:none;border:0;color:var(--muted);font-weight:600;padding:6px 0}
.count{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b),var(--c),var(--d));transition:width .3s}
.part{display:grid;gap:4px;border-left:4px solid var(--ink);padding:2px 0 2px 12px}
.part b{font-size:14px}
.part span{font-size:14px;color:var(--muted)}
.qtext{font-size:clamp(23px,6.2vw,30px);font-weight:700;letter-spacing:-.01em}
.help{font-size:15px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:16px;padding:16px 16px 16px 52px;position:relative;font-size:16px;line-height:1.4;transition:border-color .15s,background .15s}
.opt::before{content:attr(data-l);position:absolute;left:14px;top:14px;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--muted)}
.opt:hover{border-color:var(--muted)}
.opt.sel{border-color:var(--ink);background:var(--bg)}
.opt.sel::before{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.likert .opt{padding-left:52px}
.card{border-radius:24px;padding:24px 20px;color:var(--on-accent);display:grid;gap:12px;position:relative;overflow:hidden}
.card svg.big{position:absolute;right:-18px;bottom:-18px;width:150px;height:150px;opacity:.2}
.card .eyebrow{color:inherit;opacity:.85}
.card h2{font-size:clamp(34px,10vw,50px);font-weight:800;letter-spacing:-.02em}
.card .frase{font-size:18px;font-weight:600;max-width:85%;position:relative}
.chip{display:inline-block;border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700;background:rgba(255,255,255,.24);justify-self:start;position:relative}
.meter{display:flex;gap:6px;align-items:center}
.meter i{width:26px;height:8px;border-radius:99px;background:var(--line)}
.meter i.on{background:var(--ink)}
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:118px 1fr 34px;align-items:center;gap:10px;font-size:14px;font-weight:600}
.bar .t{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar .t span{display:block;height:100%;border-radius:99px}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.sec{display:grid;gap:6px}
.sec .eyebrow{font-size:11px}
.quote{border-radius:14px;padding:14px 16px;font-weight:600;font-style:italic}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{border-radius:99px;padding:6px 12px;font-size:14px;font-weight:600}
.note{font-size:14px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 200px}
.all{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{border-radius:16px;padding:14px;display:grid;gap:6px;border:1px solid var(--line);background:var(--surface);align-content:start}
.mini b{font-family:var(--display);font-size:17px}
.mini p{font-size:13px;color:var(--muted)}
.mini i{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--on-accent)}
.mini i svg{width:18px;height:18px}
.toast{font-size:14px;color:var(--muted);text-align:center;min-height:1.4em}
@media (max-width:380px){.bar{grid-template-columns:96px 1fr 30px}.steps{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:.5;transform:translateY(6px)}to{opacity:1;transform:none}}

.btn{border-radius:999px;font-weight:800}
.opt{border-radius:20px;border-width:2px}
.opt::before{border-radius:50%}
.panel{border-radius:22px;border-width:0;box-shadow:0 1px 0 var(--line)}
.eyebrow{letter-spacing:.1em}
.help{background:transparent}
.hero h1{font-weight:900;letter-spacing:-.01em}
.qtext{font-weight:800}
.progress span{background:linear-gradient(90deg,var(--a),var(--b),var(--c),var(--d))}
.tag{color:var(--ink)}
.quote{color:var(--ink)}
</style>
<style>
.logos{background:#FFFFFF;border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;align-items:center;justify-content:space-around;gap:14px;flex-wrap:wrap}
.logos img{height:40px;width:auto;max-width:30%;object-fit:contain}
.logos img.baq{height:46px}
.logos.sm{padding:8px 10px;border-radius:12px}
.logos.sm img{height:30px}
.logos.sm img.baq{height:34px}
.excl{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:var(--ink);color:var(--bg);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:700;letter-spacing:.02em}
.foot{display:grid;gap:10px;padding-top:12px;border-top:1px solid var(--line);margin-top:8px}
.foot p{font-size:12.5px;color:var(--muted);line-height:1.45}
.legaltxt{font-size:12.5px;color:var(--muted);line-height:1.5;max-height:180px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg)}
.pass{border-radius:24px;overflow:hidden;border:1px solid var(--line);background:var(--surface);display:grid}
.pass .top{padding:22px 20px;display:grid;gap:10px;position:relative;overflow:hidden}
.pass .top svg.big{position:absolute;right:-18px;bottom:-22px;width:140px;height:140px;opacity:.2}
.pass .top h2{font-size:clamp(32px,9.5vw,46px);font-weight:800;letter-spacing:-.02em;position:relative}
.pass .top .eyebrow{color:inherit;opacity:.9}
.pass .who{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:16px 20px;align-items:end;border-bottom:1px dashed var(--line)}
.pass .who b{font-family:var(--display);font-size:22px;line-height:1.15;min-width:0;overflow-wrap:anywhere}
.pass .who span{font-size:13px;color:var(--muted)}
.pass .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:15px;letter-spacing:.08em;text-align:right}
.pass .logos{border:0;border-radius:0;padding:10px 14px}
.events{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.events li{display:flex;gap:10px;align-items:center;font-weight:600}
.bandcard{background:var(--sticker);border-radius:22px;overflow:hidden;display:flex;align-items:flex-end;padding-top:10px}
.bandcard img{width:100%;height:auto;display:block}
.ascchip{display:inline-flex;align-items:center;gap:8px;justify-self:start;background:rgba(255,255,255,.92);color:#2C394E;border-radius:99px;padding:4px 12px 4px 4px;font-size:14px;font-weight:800;position:relative}
.ascchip i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.ascchip i svg{width:14px;height:14px}
.events li i{width:24px;height:24px;border-radius:7px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-style:normal;font-size:12px;flex:none}
</style>

  B:{lema:"la conexión", txt:"le suma conexión a tu forma de liderar: abres puertas, tejes confianza y juntas a las personas correctas."},

};

renuncio a todo derecho que pueda tener de inspeccionar y/o aprobar la publicidad determinada y/o cualquier otra forma de explotación en virtud de la cual se fije o divulgue mi imagen personal.";

function buildSteps(){
  const s = DATA.situaciones.map(q=>({tipo:"sit", q, order:shuffle(L)}));
  const e = shuffle(DATA.espejo).map(q=>({tipo:"esp", q}));
  return s.concat(e, [{tipo:"auto", q:DATA.autoid, order:shuffle(L)}]);
}
const PARTES = {
  sit:{t:"Parte 1 de 3 · Situaciones", d:"Escoge lo que harías tú, no lo que crees que se debería hacer."},
  esp:{t:"Parte 2 de 3 · Con otras palabras", d:"Ahora verás frases. Dinos qué tan parecidas son a ti. Algunas te sonarán conocidas: es a propósito, así confirmamos tu resultado."},
  auto:{t:"Parte 3 de 3 · Tu mirada", d:"Una última pregunta."}
};

let st = fresh();
function fresh(){ return {screen:"intro", i:0, steps:[], ans:{}, nombre:"", localidad:"", acepta:false}; }
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

/* Índice 0-100 = 60% situaciones + 40% frases espejo. Equilibrado: máx-mín <= 12. Mixto: 1.º-2.º <= 6.
   Claridad: cuántas de las 3 partes señalan el arquetipo final (3 alta, 2 media, 0-1 baja). */
function score(ans){
  const c1={A:0,B:0,C:0,D:0}, l={A:0,B:0,C:0,D:0};
  DATA.situaciones.forEach(q=>{const x=ans[q.id]; if(x) c1[x]++});
  DATA.espejo.forEach(q=>{const v=ans[q.id]; if(v) l[q.k]+=v});
  const nS=DATA.situaciones.length, nE=DATA.espejo.length/4;
  const idx={}; L.forEach(k=>{ idx[k]=Math.round(100*(0.6*c1[k]/nS + 0.4*(l[k]-nE)/(3*nE))) });
  /* Orden: índice; si empata, más respuestas en situaciones; si sigue empatado, la autoidentificación; por último el orden fijo A-B-C-D */
  const o=L.slice().sort((x,y)=> idx[y]-idx[x] || c1[y]-c1[x] || (y===ans.AUTO)-(x===ans.AUTO) || L.indexOf(x)-L.indexOf(y));
  const pred=o[0], asc=o[1];
  const top1 = L.filter(k=>c1[k]===Math.max(...L.map(z=>c1[z])));
  const top2 = L.filter(k=>l[k]===Math.max(...L.map(z=>l[z])));
  let sig=0; if(top1.includes(pred)) sig++; if(top2.includes(pred)) sig++; if(ans.AUTO===pred) sig++;
  const claridad = sig===3?"Alta":sig===2?"Media":"Baja";
  return {c1,l,idx,o,pred,asc,claridad,resultado:A[pred].nombre};
}
/* Formato PRED/ASC-XXXX. PRED = predominante, ASC = ascendente (AV Aliado vital, RS Red social, MC Mentor creativo, PJ Pionero joven).
   XXXX = huella de 4 caracteres calculada con las 29 respuestas + el nombre: las mismas respuestas y el mismo nombre dan siempre el mismo código. */
const INI = {A:"AV",B:"RS",C:"MC",D:"PJ"};
function codigo(r){
  const pre = INI[r.pred]+"/"+INI[r.asc];
  const raw = DATA.situaciones.map(q=>st.ans[q.id]).join("")+DATA.espejo.map(q=>st.ans[q.id]).join("")+st.ans.AUTO+st.nombre;
  let h=7; for(const ch of raw) h=(h*31+ch.charCodeAt(0))>>>0;
  return `${pre}-${h.toString(36).toUpperCase().slice(-4).padStart(4,"0")}`;
}

  return `

function question(){
  const s=st.steps[st.i], N=st.steps.length, pct=Math.round(st.i/N*100), P=PARTES[s.tipo];
  const first = st.i===0 || st.steps[st.i-1].tipo!==s.tipo;
  let body;
  if(s.tipo!=="esp"){
    const id = s.tipo==="auto"?"AUTO":s.q.id, sel=st.ans[id];
    body = `<h2 class="qtext">${esc(s.q.q)}</h2>${s.q.ayuda?`<p class="help">${esc(s.q.ayuda)}</p>`:""}
      <div class="opts" role="radiogroup" aria-label="Opciones">${s.order.map((k,j)=>`<button class="opt ${sel===k?"sel":""}" role="radio" aria-checked="${sel===k}" data-v="${k}" data-l="${"abcd"[j]}">${esc(s.q[k])}</button>`).join("")}</div>`;
  } else {
    const sel=st.ans[s.q.id];
    body = `<h2 class="qtext">“${esc(s.q.t)}”</h2>
      <div class="opts" role="radiogroup" aria-label="Qué tan parecido a ti">${DATA.escala.map((t,j)=>`<button class="opt ${sel===j+1?"sel":""}" role="radio" aria-checked="${sel===j+1}" data-v="${j+1}" data-l="${j+1}">${esc(t)}</button>`).join("")}</div>`;
  }
  return `
  <div class="topbar"><button class="back" id="back">← Anterior</button><span class="count">${st.i+1} / ${N}</span></div>
  <div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div>
  <div class="part"><b>${P.t}</b>${first?`<span>${P.d}</span>`:""}</div>${body}`;
}

  return `

    <div class="sec"><div class="eyebrow">Tu puerta de entrada al liderazgo</div><p>${esc(a.puerta)}</p></div>

function result(){
  const r=score(st.ans), k=r.pred, a=A[k], s=r.asc, as=A[s];
  const pass = `
  <section class="pass" aria-label="Tu tarjeta de resultado">
    <div class="top" style="background:${col(k)};color:${on(k)}">${ICON[a.icono].replace("<svg",'<svg class="big"')}
      <span class="eyebrow">BAQMUN 2026 · Mi arquetipo de liderazgo</span>
      <h2>${esc(a.nombre)}</h2>
      <p class="frase" style="font-weight:600;position:relative;max-width:88%">${esc(a.frase)}</p>
      <span class="ascchip"><i style="background:${col(s)};color:${on(s)}">${ICON[as.icono]}</i>Ascendente: ${esc(as.nombre)}</span>
    </div>
    <div class="who">
      <div style="min-width:0"><b>${esc(st.nombre)}</b><br><span>Localidad: ${esc(st.localidad)}</span></div>
      <div><span>Código</span><div class="code">${codigo(r)}</div></div>
    </div>
    ${logos(true)}
  </section>
  <section class="panel">
    <div class="eyebrow">Guarda esta tarjeta</div>
    <p><b>Toma un pantallazo ahora.</b> El día de la Inauguración de BAQMUN 2026, en el registro y entrega de escarapelas, te vamos a pedir tu arquetipo. Tenlo a la mano.</p>
    <p>Y en el cóctel de bienvenida y el networking, llegas como <b style="color:${tx(k)}">${a.nombre}</b>: sal a buscar a ${UN[a.complemento]} <b style="color:${tx(a.complemento)}">${A[a.complemento].nombre}</b>, tu dupla ideal. Así empieza el liderazgo colectivo.</p>
  </section>`;
  const ascPanel = `
  <div class="panel" style="border-left:6px solid ${col(s)}">
    <div class="eyebrow">Tu ascendente</div>
    <h3>${esc(as.nombre)}</h3>
    <p>Así como en el zodiaco el ascendente le da un matiz propio a tu signo, en tu liderazgo el ascendente es tu segunda fuerza. Tu ascendente <b>${esc(as.nombre)}</b> ${esc(ASC[s].txt)}</p>
    <div class="quote" style="background:${soft(s)}">Lideras desde ${LEMA[k]} y tu ascendente te impulsa desde ${LEMA[s]}. Esa mezcla es la que te hace único o única en el ecosistema.</div>
  </div>`;
  const clar = `<div class="panel"><div class="row" style="align-items:center;justify-content:space-between"><h3>Claridad de tu resultado: ${r.claridad.toLowerCase()}</h3><div class="meter" aria-hidden="true">${[1,2,3].map(i=>`<i class="${i<=({Alta:3,Media:2,Baja:1})[r.claridad]?"on":""}"></i>`).join("")}</div></div><p class="note">${esc(DATA.claridad[r.claridad])}</p></div>`;
  const tagOf = x => x===k?" · predominante":x===s?" · ascendente":"";
  return pass + ascPanel + ficha(k) + clar + `
  <div class="panel"><h3>Tus cuatro formas de liderar</h3>
    <div class="bars">${r.o.map(x=>`<div class="bar"><span>${A[x].nombre}<small class="note" style="display:block;font-weight:600">${tagOf(x).replace(" · ","")}</small></span><div class="t"><span style="width:${Math.max(2,r.idx[x])}%;background:${col(x)}"></span></div><span class="n">${r.idx[x]}</span></div>`).join("")}</div>
    <p class="note">Índice de 0 a 100. Todos tenemos las cuatro; la más alta es tu arquetipo predominante y la segunda, tu ascendente.</p></div>
  <div class="panel"><h3>Ningún arquetipo lidera solo</h3>
    <div class="all">${L.map(x=>`<div class="mini"><i style="background:${col(x)};color:${on(x)}">${ICON[A[x].icono]}</i><b>${A[x].nombre}</b><p>${esc(A[x].sin)}</p></div>`).join("")}</div>
    <p class="note">Un comité es fuerte cuando alguien se pregunta ¿qué diferente podríamos hacer?, alguien ¿con quién?, alguien ¿cómo hacemos que suceda? y alguien ¿cómo estamos y nos cuidamos?</p></div>
  <div class="panel ig"><h3>Sigue la conversación</h3><p>Te esperamos en <a href="https://www.instagram.com/nuestrabaq/" target="_blank" rel="noopener"><b>@nuestrabaq</b></a>: ahí compartimos oportunidades para que tu liderazgo siga creciendo después de BAQMUN.</p></div>
  <div class="row"><button class="btn" id="copy">Copiar mi resultado</button><button class="btn ghost" id="again">Volver al inicio</button></div>
  <p class="toast" id="toast" aria-live="polite"></p>`;
}

function bind(){
  const $=id=>document.getElementById(id);
  if(st.screen==="intro"){
    $("start").onclick=()=>{st.screen="datos"; render(); scrollTo(0,0)};
  } else if(st.screen==="datos"){
    $("back").onclick=()=>{st.screen="intro"; render()};
    $("f").onsubmit=e=>{
      e.preventDefault();
      st.nombre=$("nombre").value.trim().replace(/\s+/g," "); st.localidad=$("localidad").value; st.acepta=$("acepta").checked;
      const m = st.nombre.length<3 ? "Escribe tu nombre completo." : !st.localidad ? "Escoge tu localidad." : !st.acepta ? "Para continuar necesitas aceptar la autorización." : "";
      $("err").textContent=m;
      if(!m){ st.steps=buildSteps(); st.ans={}; st.i=0; st.screen="q"; render(); scrollTo(0,0); }
    };
  } else if(st.screen==="q"){
    $("back").onclick=()=>{ if(st.i===0) st.screen="datos"; else st.i--; render(); };
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const s=st.steps[st.i], id=s.tipo==="auto"?"AUTO":s.q.id;
      st.ans[id]= s.tipo==="esp" ? Number(b.dataset.v) : b.dataset.v;
      document.querySelectorAll(".opt").forEach(o=>{o.classList.toggle("sel",o===b);o.setAttribute("aria-checked",o===b)});
      setTimeout(()=>{ if(st.i<st.steps.length-1) st.i++; else st.screen="res"; render(); scrollTo(0,0)},220);
    });
  } else {
    if(!st.saved){ st.saved=true; guardar(); }
    $("again").onclick=()=>{st=fresh(); render(); scrollTo(0,0)};
    $("copy").onclick=()=>{
      const r=score(st.ans), t=`BAQMUN 2026 · ${st.nombre} (${st.localidad})\nMi arquetipo de liderazgo: ${r.resultado}\nAscendente: ${A[r.asc].nombre}\nCódigo: ${codigo(r)}`;
      const ok=()=>{$("toast").textContent="Resultado copiado."};
      try{navigator.clipboard.writeText(t).then(ok,()=>fallback(t))}catch(e){fallback(t)}
    };
  }
}
function fallback(t){const el=document.getElementById("toast");el.innerHTML=`<textarea readonly style="width:100%;height:90px;border-radius:10px;padding:8px;background:var(--surface);color:var(--ink);border:1px solid var(--line)">${esc(t)}</textarea>`;el.querySelector("textarea").select()}

/* Guarda el resultado en Supabase (tabla "resultados"). Si config.js no tiene datos, no hace nada. */
function guardar(){
  const cfg=window.SUPABASE||{};
  if(!cfg.url||!cfg.key) return;
  const r=score(st.ans);
  const fila={nombre:st.nombre, localidad:st.localidad, acepta_autorizacion:st.acepta,
    predominante:r.resultado, ascendente:A[r.asc].nombre, claridad:r.claridad, codigo:codigo(r),
    indices:r.idx, respuestas:st.ans, version:DATA.version};
  const h={"Content-Type":"application/json","apikey":cfg.key,"Prefer":"return=minimal"};
  if(cfg.key.startsWith("eyJ")) h.Authorization="Bearer "+cfg.key;
  const intento=n=>fetch(cfg.url.replace(/\/+$/,"")+"/rest/v1/resultados",{method:"POST",headers:h,body:JSON.stringify(fila)})
    .then(res=>{ if(!res.ok) throw new Error(res.status); })
    .catch(e=>{ if(n<2) setTimeout(()=>intento(n+1),2000*(n+1)); else console.warn("No se pudo guardar el resultado",e); });
  intento(0);
}

render();
</script>
